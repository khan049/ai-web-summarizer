<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f4; --surface: #ffffff; --ink: #14232b; --muted: #5d6f78;
    --line: #cdd8dd; --accent: #0b6e6e; --accent-ink: #ffffff; --err: #a3312b; --err-bg: #fbeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a1f; --surface: #172830; --ink: #e6eef1; --muted: #93a8b1;
      --line: #2b414b; --accent: #4cc3b8; --accent-ink: #072522; --err: #ff9d95; --err-bg: #3a1f1d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Instrument Sans", system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 { font: 600 clamp(2rem, 6vw, 3rem)/1.1 "Fraunces", Georgia, serif; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 0 0 28px; }
  .row { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; padding: 13px 14px; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 13px 22px; font: inherit; font-weight: 600; color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { margin-top: 28px; }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .error { background: var(--err-bg); color: var(--err); padding: 12px 14px; border-radius: 8px; }
  .result { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 22px 24px; }
  .result h2 { font: 600 1.35rem/1.25 "Fraunces", Georgia, serif; margin: 0 0 4px; }
  .result a { color: var(--muted); font-size: .875rem; word-break: break-all; }
  .result .body { margin-top: 16px; }
  .result .body p { margin: 0 0 12px; }
  .result ul { padding-left: 20px; margin: 0; }
  .result li { margin-bottom: 6px; }
  @media (max-width: 480px) { .row { flex-direction: column; } }
</style>
</head>
<body>
<main>
  <h1>Page Digest</h1>
  <p class="lede">Paste a link to an article or webpage and get a short summary.</p>
  <form class="row" id="form">
    <input id="url" type="url" placeholder="https://example.com/article" required aria-label="Webpage URL" autofocus>
    <button id="btn" type="submit">Summarize</button>
  </form>
  <div id="status" aria-live="polite"></div>
</main>
<script>
  const form = document.getElementById("form"), input = document.getElementById("url"),
        btn = document.getElementById("btn"), status = document.getElementById("status");

  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

  // Minimal renderer: paragraphs + bullet lists
  function render(md) {
    let html = "", inList = false;
    for (const line of md.split("\n")) {
      const m = line.match(/^\s*[-*•]\s+(.*)/);
      if (m) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(m[1])}</li>`; }
      else { if (inList) { html += "</ul>"; inList = false; } if (line.trim()) html += `<p>${inline(line)}</p>`; }
    }
    return html + (inList ? "</ul>" : "");
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    btn.disabled = true;
    status.innerHTML = '<div class="loading"><div class="spinner"></div>Loading… reading the page and writing a summary</div>';
    try {
      const res = await fetch("/api/summarize", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: input.value.trim() })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed.");
      status.innerHTML = `<article class="result"><h2>${esc(data.title)}</h2>
        <a href="${esc(data.url)}" target="_blank" rel="noopener">${esc(data.url)}</a>
        <div class="body">${render(data.summary)}</div></article>`;
    } catch (err) {
      status.innerHTML = `<div class="error" role="alert">${esc(err.message)}</div>`;
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
